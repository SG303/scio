version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors never become LTS; stay on even (LTS) releases
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x", "31.x", "33.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
